<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1600" viewBox="0 0 420 1600">
  <style>
    .num { font: 700 29px system-ui, -apple-system, sans-serif; fill: #f7f4ef; text-anchor: middle; dominant-baseline: middle; }
    .label { font: 650 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f7f4ef; dominant-baseline: middle; }
    .endlabel { font: 750 29px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f7f4ef; dominant-baseline: middle; }
  </style>

  <rect width="420" height="1600" fill="#211a17"/>

  <!-- 8-pin group -->
  <path d="M105 80 V570" stroke="#8c817a" stroke-width="5"/>

  <rect x="22" y="46" width="356" height="68" rx="8" fill="none" stroke="#f7f4ef" stroke-width="5"/>
  <rect x="31" y="55" width="54" height="50" rx="5" fill="#f7f4ef"/>
