  <text x="58" y="970" class="num">11</text><rect x="94" y="958" width="23" height="23" fill="#f7f4ef"/><text x="145" y="970" class="label">PA13</text>
  <text x="58" y="1040" class="num">12</text><rect x="94" y="1028" width="23" height="23" fill="#f7f4ef"/><text x="145" y="1040" class="label">PA9</text>
