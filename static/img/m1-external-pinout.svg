  <rect x="31" y="545" width="54" height="50" rx="5" fill="#f7f4ef"/>
  <text x="58" y="571" class="num" fill="#211a17" style="fill:#211a17">8</text>
  <rect x="94" y="559" width="23" height="23" fill="#f7f4ef"/>
  <text x="145" y="571" class="endlabel">GND</text>

  <!-- 10-pin group -->
